name: Snyk CI/CD Demo

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_ORG: ${{ vars.SNYK_ORG }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
      # The URL must match the target Snyk derives from the git remote.
      REPO_URL: github.com/${{ github.repository }}
      IMAGE: nodejs-goof:${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Snyk CLI
        run: npm install -g snyk
        
      # Snyk Code: run before npm install so node_modules isn't scanned
      # Snyk Code test and UI snapshot
      - name: Snyk Code
        continue-on-error: true
        run: snyk code test --org=$SNYK_ORG --severity-threshold=high

      - name: Snyk Code snapshot
        continue-on-error: true
        run: |
          snyk code test --org=$SNYK_ORG --report \
            --project-name=code-analysis \
            --remote-repo-url=$REPO_URL \
            --target-reference="$BRANCH"

      - name: Install dependencies
        run: npm install

      # Snyk SCA test and UI snapshot
      # To gate the build, remove continue-on-error from the step below.
      - name: Snyk Open Source
        continue-on-error: true
        run: snyk test --org=$SNYK_ORG --severity-threshold=high

      - name: Snyk Open Source monitor
        run: |
          snyk monitor --org=$SNYK_ORG \
            --remote-repo-url=$REPO_URL \
            --target-reference="$BRANCH"
            
      # IaC test and UI snapshot
      - name: Snyk IaC
        continue-on-error: true
        run: snyk iac test --org=$SNYK_ORG --severity-threshold=high

      - name: Snyk IaC snapshot
        continue-on-error: true
        run: |
          snyk iac test --org=$SNYK_ORG --report \
            --remote-repo-url=$REPO_URL \
            --target-reference="$BRANCH"

      - name: Build Docker image
        run: docker build -t $IMAGE .

      # Snyk Container test and UI snapshot
      - name: Snyk Container
        continue-on-error: true
        run: snyk container test $IMAGE --org=$SNYK_ORG --file=Dockerfile --severity-threshold=high

      - name: Snyk Container monitor
        run: |
          snyk container monitor $IMAGE --org=$SNYK_ORG --file=Dockerfile \
            --target-reference="$BRANCH"
